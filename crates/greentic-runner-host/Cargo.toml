[package]
name = "greentic-runner-host"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Host runtime shim for Greentic runner: config, pack loading, activity handling"
homepage = "https://github.com/greentic-ai/greentic-runner"
repository = "https://github.com/greentic-ai/greentic-runner"
readme = "README.md"
keywords = ["greentic", "runner", "wasmtime", "mcp", "flows"]
categories = ["asynchronous", "api-bindings", "command-line-utilities"]

[features]
default = ["verify", "agentic-worker"]
telemetry = ["dep:greentic-telemetry"]
verify = []
session-redis = ["greentic-session/redis"]
fault-injection = []
component-v0-6-introspection = []
# Gates the agentic-worker (DwAgent) node implementation and its deps
# (greentic-aw-runtime + greentic-ext-runtime). Disable this feature to
# produce a lean, publishable build that lacks DwAgent node support.
agentic-worker = ["dep:greentic-aw-runtime", "dep:greentic-ext-runtime"]
# Multi-provider in-process LLM backend for dw.agent (DeepSeek/Anthropic/…),
# routing the worker LLM call through greentic-llm. Opt-in (pulls rig-core).
greentic-llm-backend = ["agentic-worker", "greentic-aw-runtime?/greentic-llm-backend"]
# Adds the ephemeral (in-memory) agent builder for desktop/local runs.
# Enables the test-mock types from greentic-aw-runtime; must NOT be enabled
# in the server binary — the server always uses the Redis path.
desktop-agent-ephemeral = ["agentic-worker", "greentic-aw-runtime?/test-mock", "greentic-aw-runtime?/dev-allow-unsigned"]
# Wires an operator-configured native Chronicle (graphiti over Neo4j) long-term
# memory backend into the agentic worker. Heavy (pulls the Chronicle graph
# engine); off by default. The operator supplies Neo4j + the LLM and embedding
# endpoints via GREENTIC_CHRONICLE_* env vars; chronicle is driven through the
# provider-neutral DW LLM/embedding families (any OpenAI-compatible endpoint —
# no single-provider lock). Absent the env, long-term stays disabled.
long-term-chronicle = [
    "agentic-worker",
    "dep:greentic-dw-memory-chronicle",
    "dep:greentic-dw-llm",
    "dep:greentic-dw-llm-openai-compatible",
    "dep:greentic-dw-embedding",
    "dep:greentic-dw-embedding-openai-compatible",
    # Turns on greentic-dw-providers-common's `pack-manifest-agents` feature so it
    # emits PackManifest.agents against the greentic-types rev we pin (where that
    # field is required). Without it the transitive common copy fails to compile.
    "dep:greentic-dw-providers-common",
]
# Wires an operator-configured native Chronicle knowledge (document-RAG / W4)
# backend into the agentic worker for auto pre-retrieval. Separate tier from
# long-term-chronicle (own capability + own embedded store) but the same heavy
# Chronicle stack; off by default. The operator supplies the embedding endpoint
# via GREENTIC_KNOWLEDGE_EMBED_* and the graph store via GREENTIC_KNOWLEDGE_BACKEND
# (defaults to embedded SurrealDB — no external graph server). Absent the embedding
# env, knowledge stays disabled. The runner-host edge builds the SurrealDB driver
# here (where bindgen / RocksDB live) and injects it into the provider.
knowledge-chronicle = [
    "agentic-worker",
    "dep:greentic-dw-knowledge-chronicle",
    "dep:greentic-dw-knowledge",
    "dep:chronicle-core",
    "dep:chronicle-driver-surreal",
    "dep:chronicle-driver-neo4j",
    "dep:chronicle-driver-falkor",
    # Same greentic-types `agents` skew as long-term-chronicle (the knowledge
    # crates transitively pull greentic-dw-providers-common).
    "dep:greentic-dw-providers-common",
]

[dependencies]
async-nats = "0.46"
async-trait.workspace = true
anyhow.workspace = true
arc-swap.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
cron.workspace = true
greentic-aw-runtime = { path = "../greentic-aw-runtime", version = "=1.2.0-research", features = ["serve"], optional = true }
greentic-dw-memory-chronicle = { git = "https://github.com/greenticai/greentic-dw-providers.git", branch = "research", optional = true }
greentic-dw-llm = { git = "https://github.com/greenticai/greentic-dw-providers.git", branch = "research", optional = true }
greentic-dw-llm-openai-compatible = { git = "https://github.com/greenticai/greentic-dw-providers.git", branch = "research", optional = true }
greentic-dw-embedding = { git = "https://github.com/greenticai/greentic-dw-providers.git", branch = "research", optional = true }
greentic-dw-embedding-openai-compatible = { git = "https://github.com/greenticai/greentic-dw-providers.git", branch = "research", optional = true }
# Pulled only to enable its `pack-manifest-agents` feature (see the
# long-term-chronicle feature). The crate is otherwise a transitive dep of the
# openai-compatible providers above.
greentic-dw-providers-common = { git = "https://github.com/greenticai/greentic-dw-providers.git", branch = "research", optional = true, features = ["pack-manifest-agents"] }
# Knowledge (document-RAG / W4) tier. The chronicle provider + its core trait/DTOs
# come from greentic-dw-providers; the SurrealDB driver + GraphDriver trait come
# from greentic-chronicle-ext and are built at this edge (bindgen / RocksDB live
# here). All optional, gated by the `knowledge-chronicle` feature.
greentic-dw-knowledge-chronicle = { git = "https://github.com/greenticai/greentic-dw-providers.git", branch = "research", optional = true }
greentic-dw-knowledge = { git = "https://github.com/greenticai/greentic-dw-providers.git", branch = "research", optional = true }
chronicle-core = { git = "https://github.com/greentic-biz/greentic-chronicle-ext.git", branch = "research", optional = true }
chronicle-driver-surreal = { git = "https://github.com/greentic-biz/greentic-chronicle-ext.git", branch = "research", optional = true }
chronicle-driver-neo4j = { git = "https://github.com/greentic-biz/greentic-chronicle-ext.git", branch = "research", optional = true }
chronicle-driver-falkor = { git = "https://github.com/greentic-biz/greentic-chronicle-ext.git", branch = "research", optional = true }
greentic-ext-runtime = { git = "https://github.com/greentic-biz/greentic-designer-extensions", rev = "50ce911f161f3d0d2488f4f455cd55cdbf69de05", optional = true }
greentic-flow.workspace = true
greentic-interfaces-host.workspace = true
greentic-interfaces-wasmtime.workspace = true
greentic-interfaces.workspace = true
greentic-types = { workspace = true, features = ["telemetry-autoinit"] }
greentic_pack.workspace = true
greentic-distributor-client.workspace = true
greentic-session.workspace = true
greentic-state.workspace = true
greentic-secrets-lib.workspace = true
greentic-config.workspace = true
greentic-config-types.workspace = true
hex.workspace = true
humantime.workspace = true
indexmap.workspace = true
lru.workspace = true
parking_lot.workspace = true
rand.workspace = true
reqwest.workspace = true
runner-core.workspace = true
serde = { workspace = true }
serde_cbor.workspace = true
serde_json.workspace = true
serde_yaml_bw.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
time.workspace = true
tracing.workspace = true
url.workspace = true
wasmparser.workspace = true
zip.workspace = true
bytes.workspace = true
futures.workspace = true
hmac.workspace = true
sha1.workspace = true
blake3.workspace = true
once_cell.workspace = true
tempfile.workspace = true
handlebars.workspace = true
dashmap.workspace = true
wasmtime-environ.workspace = true
jsonschema.workspace = true
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "postgres",
    "mysql",
    "chrono",
    "json",
] }
subtle = "2"

# External stack components
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-http = { workspace = true }
wasmtime-wasi-tls = { workspace = true }
# Needed to install a process-level rustls CryptoProvider for wasi-tls.
# rustls 0.23 (pulled by wasmtime-wasi-tls 45) refuses to auto-select a
# provider when both `aws-lc-rs` (via reqwest/hyper-rustls) and `ring`
# (via wasmtime-wasi-tls) are linked, so the runner must pick one explicitly.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
greentic-telemetry = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
serial_test.workspace = true
tempfile.workspace = true
once_cell.workspace = true
semver.workspace = true
proptest.workspace = true
tower.workspace = true
http-body-util = "0.1"
wiremock = "0.6"
greentic-aw-runtime = { path = "../greentic-aw-runtime", version = "=1.2.0-research", features = ["test-mock"] }

[[bench]]
name = "perf"
harness = false
