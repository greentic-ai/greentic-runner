[package]
name = "greentic-runner-host"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Host runtime shim for Greentic runner: config, pack loading, activity handling"
homepage = "https://github.com/greentic-ai/greentic-runner"
repository = "https://github.com/greentic-ai/greentic-runner"
readme = "README.md"
keywords = ["greentic", "runner", "wasmtime", "mcp", "flows"]
categories = ["asynchronous", "api-bindings", "command-line-utilities"]

[features]
default = ["verify"]
verify = []
session-redis = ["greentic-session/redis"]
fault-injection = []
component-v0-6-introspection = []
# Declared but off by default. C5.4 introduced #[cfg(feature = "telemetry")]
# gates around greentic_telemetry::annotate_span calls; turning the gate on
# activates explicit span annotation (greentic-telemetry is always linked).
telemetry = []
greentic-x-provider = ["dep:greentic-x-runtime", "dep:greentic-x-types"]

# Feature values still referenced by #[cfg(feature = "…")] gates in the source but
# whose declarations + deps were removed from the develop lane in d43ae4dd (main-only
# agentic-worker wiring — greentic-aw-runtime / greentic-ext-runtime pin conflicting
# 1.1.x deps). The gated code stays permanently dead here; we cannot re-declare these
# as real features because the gated code references the removed crates and would break
# `--all-features` builds. Tell check-cfg the values are expected so `-D warnings`
# (unexpected_cfgs) does not fire. Re-declare as real features when the crates publish
# on develop and the wiring is restored.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("agentic-worker", "desktop-agent-ephemeral", "greentic-llm-backend", "knowledge-chronicle", "long-term-chronicle"))',
] }

[dependencies]
async-nats = "0.49"
async-trait.workspace = true
anyhow.workspace = true
arc-swap.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
cron.workspace = true
greentic-flow.workspace = true
greentic-interfaces-host.workspace = true
greentic-interfaces-wasmtime.workspace = true
greentic-interfaces.workspace = true
greentic-x-runtime = { workspace = true, optional = true }
greentic-x-types = { workspace = true, optional = true }
greentic-types = { workspace = true, features = ["telemetry-autoinit"] }
greentic_pack.workspace = true
greentic-distributor-client.workspace = true
greentic-deploy-spec.workspace = true
greentic-session.workspace = true
greentic-state.workspace = true
greentic-secrets-lib.workspace = true
greentic-config.workspace = true
greentic-config-types.workspace = true
hex.workspace = true
humantime.workspace = true
indexmap.workspace = true
lru.workspace = true
opentelemetry = "0.31"
parking_lot.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
runner-core.workspace = true
serde = { workspace = true }
serde_cbor.workspace = true
serde_json.workspace = true
serde_yaml_bw.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
time.workspace = true
tracing.workspace = true
url.workspace = true
wasmparser.workspace = true
zip.workspace = true
bytes.workspace = true
futures.workspace = true
hmac.workspace = true
sha1.workspace = true
blake3.workspace = true
once_cell.workspace = true
tempfile.workspace = true
handlebars.workspace = true
dashmap.workspace = true
wasmtime-environ.workspace = true
jsonschema.workspace = true
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "postgres",
    "mysql",
    "chrono",
    "json",
] }
subtle = "2"

# External stack components
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-http = { workspace = true }
wasmtime-wasi-tls = { workspace = true }
greentic-telemetry = { workspace = true }

[dev-dependencies]
criterion.workspace = true
serial_test.workspace = true
tempfile.workspace = true
once_cell.workspace = true
semver.workspace = true
proptest.workspace = true
# C5.4 export regression: a real OTLP exporter to prove gt.* attribution reaches
# exported spans. Versions match greentic-telemetry's OTel stack.
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["registry"] }
tower.workspace = true
http-body-util = "0.1"
wiremock = "0.6"

[[bench]]
name = "perf"
harness = false
