[package]
name        = "greentic-aw-runtime"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
description = "Enterprise Agentic Worker runtime — Plan-Act-Observe loop, Redis state, tool dispatch via greentic-ext-runtime"
publish     = false

[features]
default   = []
test-mock = []

[dependencies]
anyhow              = { workspace = true }
async-trait         = { workspace = true } # Used ONLY for object-safe trait bounds where RPITIT cannot be expressed (none in MVP); kept for forward-compat; do NOT use on AW traits.
chrono              = { version = "0.4", features = ["serde"] }
dashmap             = { workspace = true }
futures             = { workspace = true }
greentic-dw-manifest = { git = "https://github.com/greenticai/greentic-dw.git", branch = "research" }
greentic-ext-runtime = { git = "https://github.com/greentic-biz/greentic-designer-extensions", tag = "v1.2.21-research" }
greentic-extension-sdk-contract = "=1.2.7-research"
# MCP transport for the agentic-worker MCP tool source (MCP-4). reqwest 0.13.
greentic-mcp-client = { version = "=1.2.0-research", features = ["native"] }
greentic-state      = { workspace = true }
greentic-telemetry  = { workspace = true }
redis               = { version = "1", features = ["tokio-comp", "connection-manager", "script"] }
reqwest             = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
secrecy             = "0.10"
serde               = { version = "1", features = ["derive"] }
serde_json          = { workspace = true }
thiserror           = { workspace = true }
tokio               = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing             = { workspace = true }
url                 = { workspace = true }
uuid                = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
semver = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
wiremock = "0.6"
