[package]
name = "greentic-runner-desktop"
version.workspace = true
edition.workspace = true
description = "Developer desktop runner harness for Greentic packs"
license = "MIT"
homepage = "https://github.com/greentic-ai/greentic-runner"
repository = "https://github.com/greentic-ai/greentic-runner"

# agentic-worker / desktop-agent-ephemeral / greentic-llm-backend cfg gates remain in
# the source but their feature declarations were removed from the develop lane in
# d43ae4dd (main-only wiring). Whitelist the values for check-cfg so `-D warnings`
# (unexpected_cfgs) does not fire on the dead gates.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("agentic-worker", "desktop-agent-ephemeral", "greentic-llm-backend"))',
] }

[features]
# `build_host_config` already gates `HostConfig`'s `agents`/`graphs` on this
# flag, but the flag itself was never declared — so while the host's
# `agentic-worker` was a stub the cfg was permanently false and nothing
# noticed. Now that the host carries the feature by default, declare it here
# and forward it, keeping the two crates' views of `HostConfig` in step.
default = ["agentic-worker"]
agentic-worker = ["greentic-runner-host/agentic-worker"]

[dependencies]
anyhow.workspace = true
greentic-runner-host = { workspace = true }
greentic_pack.workspace = true
parking_lot.workspace = true
runner-core.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_bw.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
async-trait.workspace = true
greentic-secrets-lib.workspace = true
greentic-types.workspace = true
once_cell.workspace = true
semver.workspace = true
serial_test.workspace = true
tempfile.workspace = true
