[package]
name = "greentic-runner-desktop"
version.workspace = true
edition.workspace = true
description = "Developer desktop runner harness for Greentic packs"
license = "MIT"
homepage = "https://github.com/greentic-ai/greentic-runner"
repository = "https://github.com/greentic-ai/greentic-runner"

[features]
default = ["agentic-worker"]
# Propagates the agentic-worker feature to the host shim.
# Keep out of published defaults when greentic-aw-runtime is not on crates.io.
agentic-worker = ["greentic-runner-host/agentic-worker", "greentic-runner-host/desktop-agent-ephemeral"]

[dependencies]
anyhow.workspace = true
greentic-runner-host = { workspace = true, features = ["telemetry"] }
greentic_pack.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_bw.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zip.workspace = true
runner-core.workspace = true

[dev-dependencies]
async-trait.workspace = true
greentic-secrets-lib.workspace = true
greentic-types.workspace = true
once_cell.workspace = true
semver.workspace = true
serial_test.workspace = true
tempfile.workspace = true
