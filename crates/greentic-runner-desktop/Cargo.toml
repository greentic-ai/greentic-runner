[package]
name = "greentic-runner-desktop"
version.workspace = true
edition.workspace = true
description = "Developer desktop runner harness for Greentic packs"
license = "MIT"
homepage = "https://github.com/greentic-ai/greentic-runner"
repository = "https://github.com/greentic-ai/greentic-runner"

[features]
# `build_host_config` already gates `HostConfig`'s `agents`/`graphs` on this
# flag, but the flag itself was never declared — so while the host's
# `agentic-worker` was a stub the cfg was permanently false and nothing
# noticed. Now that the host carries the feature by default, declare it here
# and forward it, keeping the two crates' views of `HostConfig` in step.
default = ["agentic-worker"]
agentic-worker = ["greentic-runner-host/agentic-worker"]
# Multi-provider in-process LLM backend (DeepSeek/Anthropic/…) via greentic-llm.
# Off by default; restored on develop alongside the host's own declaration.
greentic-llm-backend = ["agentic-worker", "greentic-runner-host/greentic-llm-backend"]
# Enables the ephemeral (in-memory) agent state store for desktop/local runs.
# Activates test-mock types from greentic-aw-runtime; must NOT be in `default`
# so the server build (agentic-worker only) never compiles the mocks. Gates the
# no-Redis branch in `build_host_config` — without it a desktop run with
# GREENTIC_AW_REDIS_URL unset logs "dw.agent nodes disabled" and serves none.
desktop-agent-ephemeral = ["agentic-worker", "greentic-runner-host/desktop-agent-ephemeral"]

[dependencies]
anyhow.workspace = true
greentic-runner-host = { workspace = true }
greentic_pack.workspace = true
parking_lot.workspace = true
runner-core.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_bw.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
async-trait.workspace = true
greentic-secrets-lib.workspace = true
greentic-types.workspace = true
once_cell.workspace = true
semver.workspace = true
serial_test.workspace = true
tempfile.workspace = true
