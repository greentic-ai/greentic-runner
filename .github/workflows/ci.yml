name: CI
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
    inputs:
      run_heavy_wasm:
        description: "Run heavy WASM fixture tests"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # HISTORY: this repo used to run fmt + toolchain-check ONLY, on the grounds
  # that cargo clones EVERY git dependency during resolution to read its
  # manifest — including the optional, default-OFF `knowledge-chronicle` deps
  # (chronicle-core / chronicle-driver-*) that live in the CROSS-ORG private
  # repo `greentic-biz/greentic-chronicle-ext` — so any compiling job would die
  # at dependency-fetch with `greenticai`-only credentials.
  #
  # That is no longer true on this lane. Those deps are declared only on
  # `research`; `main` has ZERO git dependencies (`grep -c 'source = "git'
  # Cargo.lock` → 0), and Nightly Coverage already builds the whole workspace
  # with `--all-features` on a stock runner using a plain `actions/checkout@v4`
  # and no extra credentials. So a compile gate IS possible here, and its
  # absence was expensive: #653 landed a `#[cfg(feature =
  # "desktop-agent-ephemeral")]`-gated call site that did not compile, went
  # green on `main`, and was only caught by Nightly Coverage the next morning
  # (fixed in #659).
  #
  # `clippy --all-targets --all-features` is the gate rather than a plain
  # `cargo check`: it compiles every target including test code, which is where
  # feature-gated breaks hide, and it enforces the same `-D warnings` bar as
  # `ci/local_check.sh`. Test *execution* deliberately stays with Nightly
  # Coverage — this job is about "does it build", which is the gap that bit us.
  #
  # If a chronicle dep is ever added to this lane, this job will fail at
  # dependency-fetch. That is the signal to provision a cross-org deploy
  # key / PAT, not to delete the gate.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          toolchain: 1.95.0
          targets: wasm32-wasip2
          components: clippy

      - name: Install wasm32-wasip2 target
        run: rustup target add wasm32-wasip2 --toolchain 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Clippy (all targets, all features, warnings denied)
        run: cargo clippy --all-targets --all-features --workspace --locked -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  toolchain-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain drift (warning-only)
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/greenticai/.github/main/toolchain"
          curl -sL "${BASE}/host/rust-toolchain.toml" -o /tmp/canonical-toolchain.toml
          curl -sL "${BASE}/rustfmt.toml" -o /tmp/canonical-rustfmt.toml
          if ! diff -q rust-toolchain.toml /tmp/canonical-toolchain.toml >/dev/null 2>&1; then
            echo "::warning::rust-toolchain.toml differs from canonical host variant"
            diff rust-toolchain.toml /tmp/canonical-toolchain.toml || true
          fi
          if ! diff -q rustfmt.toml /tmp/canonical-rustfmt.toml >/dev/null 2>&1; then
            echo "::warning::rustfmt.toml differs from canonical"
            diff rustfmt.toml /tmp/canonical-rustfmt.toml || true
          fi

  # The crates.io publish list is duplicated across release-binaries.yml (tag
  # `v*`) and crates-publish.yml (tag `runnercrates-v*`) with nothing keeping
  # the two in sync. #655 fixed the drift that half-published v1.1.10; this
  # gate is what stops it recurring. Cheap (no toolchain, no build), so it runs
  # on every PR rather than waiting for a release to expose the mismatch.
  publish-lanes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert both publish lanes list the same crates
        run: ./ci/assert_publish_crate_lists_match.sh

  heavy_wasm:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_heavy_wasm == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          toolchain: 1.95.0
          targets: wasm32-wasip2

      - name: Install wasm32-wasip2 target
        run: rustup target add wasm32-wasip2 --toolchain 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run heavy WASM fixture tests
        env:
          GREENTIC_HEAVY_WASM: "1"
        run: |
          cargo test -p greentic-runner-host --test component_v06_introspection --features component-v0-6-introspection --locked
          cargo test -p greentic-runner --test contract_cli contract_pack_rejects_mismatched_artifact --locked
