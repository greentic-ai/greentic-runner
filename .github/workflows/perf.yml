name: Perf (lightweight)

permissions:
  contents: read

on:
  push:
    branches:
      - main
  schedule:
    # 04:41 UTC — staggered to avoid the 00/05/15/30/45 hot-spots.
    - cron: "38 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run perf guard tests
        run: cargo test -p greentic-runner-host --test perf_scaling --test perf_timeout --all-features --locked

      - name: Run benchmark smoke test
        run: cargo bench -p greentic-runner-host --bench perf --locked -- --sample-size 10
