name: Perf (lightweight)

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run perf guard tests
        run: cargo test -p greentic-runner-host --test perf_scaling --test perf_timeout --all-features --locked

      - name: Run benchmark smoke test
        run: cargo bench -p greentic-runner-host --bench perf --locked -- --sample-size 10
