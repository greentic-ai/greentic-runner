name: Bindings generator
permissions:
  contents: read

# NOTE: no `pull_request:` trigger. This job runs `cargo test --package
# greentic-runner`, which resolves the whole workspace; cargo then clones the
# cross-org private repo `greentic-biz/greentic-chronicle-ext` (optional
# `knowledge-chronicle` deps) during resolution. PR CI lacks cross-org
# credentials, so it always failed at dependency-fetch — pure red noise on every
# PR. Restore the `pull_request:` trigger once a cross-org deploy-key/PAT is
# provisioned (see ci.yml for the same rationale).
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 1.91.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run generator tests
        run: cargo test --package greentic-runner --test gen_bindings
